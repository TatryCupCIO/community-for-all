<head>

  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #111827;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding:
        max(16px, env(safe-area-inset-top))
        18px
        max(40px, env(safe-area-inset-bottom));
    }

    /* ===== GLOBAL NOTIFICATIONS ===== */

    #globalNotifications {
  position: relative;
  z-index: 10000;
}

#notificationBellBtn {
  position: relative;

  width: 34px;
  height: 34px;
  min-width: 34px;
  min-height: 34px;

  margin: 0;
  padding: 0;

  border: none;
  border-radius: 50%;

  background: #ffffff;

  font-size: 17px;
  line-height: 34px;

  cursor: pointer;

  box-shadow: 0 3px 12px rgba(0,0,0,0.22);
}

    #notificationBadge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: #e53935;
      color: white;
      font-size: 12px;
      font-weight: bold;
      line-height: 20px;
      text-align: center;
    }

    #notificationPanel {
      position: absolute;
      top: 56px;
      right: 0;
      width: min(330px, calc(100vw - 32px));
      max-height: 420px;
      overflow-y: auto;
      background: white;
      color: #111827;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      padding: 14px;
    }

    #notificationPanelTitle {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 10px;
    }

    /* ===== MAIN LAYOUT ===== */

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 46px;
    }

    .top-left {
  display: flex;
  align-items: center;
}

.top-actions {
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.account-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  flex: 0 0 auto;
}

.account-quick-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 8px;

  margin-top: 4mm;

  width: 100%;

  box-sizing: border-box;
}

    .user-btn,
    .cart-top-btn,
    .lang-btn,
    .back-btn,
    .donate-top-btn {
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      border-radius: 9px;
      padding: 9px 12px;
    }

    .donate-top-btn {
      background: #be123c;
      border-color: #e11d48;
      font-weight: 800;
    }

    .cart-top-btn {
      position: relative;
      font-size: 19px;
    }

    .cart-badge {
      position: absolute;
      right: -7px;
      top: -8px;
      background: #ef4444;
      color: #fff;
      border-radius: 999px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      border: 2px solid #111827;
    }

    .logo {
      text-align: center;
      margin: 6px 0 5px;
      font-size: 32px;
      font-weight: 800;
    }

    .community {
      color: #ff9f43;
    }

    .for {
      color: #32d7e8;
    }

    .all {
      color: #ff5c5c;
    }

    .charity {
      text-align: center;
      color: #cbd5e1;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .language {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .lang-btn.active {
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .menu-btn {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 17px 15px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .events {
      background: #f59e0b;
    }

    .bookings {
      background: #0891b2;
    }

    .fatra {
      background: #16a34a;
    }

    .face {
      background: #d98cff;
      color: #111827;
    }

    .about {
      background: #dc2626;
    }

    .contact {
      background: #2563eb;
    }

    .page {
      display: none;
    }

    .page h2 {
      text-align: center;
    }

    .card,
    .event-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      line-height: 1.55;
    }

    .event-card {
      cursor: pointer;
    }

    .event-title {
      font-size: 20px;
      font-weight: 800;
      color: #fbbf24;
      margin-bottom: 8px;
    }

    .event-info,
    .small {
      color: #cbd5e1;
    }

    .small {
      font-size: 13px;
    }

    .detail-section {
      margin-top: 18px;
    }

    .detail-section h3 {
      margin-bottom: 8px;
      color: #fbbf24;
    }

    .detail-text {
      white-space: pre-line;
      color: #e2e8f0;
    }

    .reserve-heading {
      margin-top: 28px;
      text-align: center;
      color: #86efac;
    }

    .option-group {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #475569;
    }

    .option-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .option-row {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin: 8px 0;
    }

    .option-name {
      font-weight: 700;
    }

    .option-description {
      color: #cbd5e1;
      font-size: 13px;
      margin-top: 6px;
      white-space: pre-line;
    }

    .option-price {
      color: #86efac;
      font-weight: 800;
      margin-top: 7px;
    }

    .option-special {
      margin-top: 7px;
      color: #fbbf24;
      font-size: 13px;
      font-weight: 700;
    }

    .qty-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .qty-btn,
    .guest-btn {
      border: 0;
      border-radius: 8px;
      background: #334155;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
    }

    .qty-btn {
      width: 38px;
      height: 38px;
    }

    .guest-btn {
      width: 34px;
      height: 34px;
    }

    .qty-value,
    .guest-count {
      min-width: 28px;
      text-align: center;
      font-weight: 800;
    }

    .add-btn {
      margin-left: auto;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: #16a34a;
      color: #fff;
      font-weight: 800;
    }

    .guest-box {
      margin-top: 14px;
      padding: 13px;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    .guest-title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .guest-section {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }

    .guest-counter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }

    .guest-counter-label {
      font-weight: 700;
    }

    .guest-counter-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .child-age-list {
      margin-top: 7px;
    }

    .child-age-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .child-age-row span {
      flex: 1;
    }

    .child-age-row input {
      width: 90px;
    }

    .paid-child-title {
      color: #fde68a;
      font-weight: 800;
    }

    .free-child-title {
      color: #86efac;
      font-weight: 800;
    }

    .child-free-note {
      margin-top: 12px;
      padding: 12px;
      background: #422006;
      border: 1px solid #a16207;
      border-radius: 8px;
      color: #fde68a;
      font-size: 13px;
      line-height: 1.45;
    }

    .child-free-note .guest-counter {
      color: #fff;
      margin-top: 8px;
    }

    .child-free-note .child-age-row {
      color: #fff;
    }

    .child-free-note input {
      background: #0f172a;
    }

    .free-price {
      display: block;
      margin-top: 5px;
      color: #86efac;
      font-size: 15px;
      font-weight: 900;
    }

    .capacity-note {
      margin-top: 9px;
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
    }

    .guest-required-note {
      margin-top: 9px;
      color: #cbd5e1;
      font-size: 12px;
    }

    .child-box {
      margin-top: 10px;
      padding: 10px;
      background: #172033;
      border-radius: 9px;
    }

    .cart-box {
      margin-top: 18px;
      background: #172554;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 14px;
    }

    .countdown {
      font-weight: 800;
      color: #fbbf24;
      margin: 8px 0;
    }

    .cart-item {
      padding: 11px 0;
      border-bottom: 1px solid #334155;
    }

    .cart-item-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .remove-btn {
      border: 0;
      border-radius: 7px;
      background: #7f1d1d;
      color: #fff;
      padding: 7px 9px;
      white-space: nowrap;
    }

    .cart-total {
      font-size: 18px;
      font-weight: 800;
      margin-top: 10px;
    }

    .cart-actions {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .secondary-btn,
    .checkout-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      font-weight: 800;
      color: #fff;
    }

    .secondary-btn {
      background: #334155;
    }

    .checkout-btn {
      background: #16a34a;
    }

    .checkout-btn:disabled {
      background: #475569;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
    }

    .checkbox-line {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 14px;
    }

    .checkbox-line input {
      width: auto;
      margin-top: 4px;
    }

    .checkbox-line label {
      margin: 0;
      font-weight: 400;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 14px;
      margin-top: 18px;
      background: #0ea5e9;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .logout-btn {
      background: #dc2626;
    }

    .green-btn {
      background: #16a34a;
    }

    .purple-btn {
      background: #d98cff;
      color: #111827;
    }

    .auth-link-btn {
      background: none;
      border: 0;
      color: #7dd3fc;
      text-decoration: underline;
      margin-top: 12px;
    }

    .auth-links {
      text-align: center;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
    }

    .success {
      display: block;
      background: #14532d;
      border: 1px solid #22c55e;
    }

    .error {
      display: block;
      background: #7f1d1d;
      border: 1px solid #ef4444;
    }

    .info {
      display: block;
      background: #164e63;
      border: 1px solid #22d3ee;
    }

    .loading {
      text-align: center;
      color: #cbd5e1;
      padding: 25px;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 35px;
      line-height: 1.6;
    }

    .account-name {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
    }

    .account-email {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 20px;
      overflow-wrap: anywhere;
    }

    .donate-hero {
      text-align: center;
    }

    .donate-heart {
      font-size: 46px;
    }

    .donate-motto {
      font-size: 20px;
      font-weight: 800;
      margin: 8px 0;
    }

    .donate-sub {
      color: #cbd5e1;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .amount-btn {
      border: 1px solid #fb7185;
      background: #4c0519;
      color: #fff;
      border-radius: 9px;
      padding: 11px 5px;
      font-weight: 800;
    }

    .amount-btn.active {
      background: #e11d48;
    }

    .donation-row {
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .donation-name {
      font-weight: 800;
    }

    .donation-amount {
      color: #86efac;
      font-weight: 800;
    }

    .notice {
      padding: 12px;
      background: #422006;
      border: 1px solid #a16207;
      border-radius: 9px;
      color: #fde68a;
      margin-top: 12px;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #334155;
      font-size: 12px;
      margin-top: 5px;
    }

    @media(max-width:420px) {
      .container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .donate-top-btn,
      .user-btn {
        padding: 8px 9px;
        font-size: 13px;
      }

      .cart-top-btn {
        padding: 8px 10px;
      }

      .logo {
        font-size: 29px;
      }
    }
  </style>

<body class="cfa-session-locked">

<div class="container">
<!-- GLOBAL NOTIFICATIONS / TOP BAR -->

<div class="topbar">

  <div class="top-left">
    <button
      class="donate-top-btn"
      id="donateTopBtn"
      onclick="showDonate()"
    >
      💗 Podporte nás
    </button>
  </div>

  <div class="top-actions">

    <button
      class="cart-top-btn"
      onclick="showCartPage()"
    >
      🛒
      <span
        class="cart-badge"
        id="cartBadge"
      >0</span>
    </button>

    <div class="account-actions">

      <button
        class="user-btn"
        id="userTopBtn"
        onclick="openUserArea()"
      >

      </button>

      <div class="account-quick-actions">

        <button
          id="communityChatBtn"
          class="community-chat-btn"
          type="button"
          onclick="openCommunityChat()"
        >
          <span>💬 CHAT</span>

          <span
            id="communityChatUnreadDot"

            style="display:none;"
          ></span>
        </button>

        <div id="globalNotifications">

          <button
            id="notificationBellBtn"
            type="button"
            aria-label="Notifications"

            🔔

            <span
              id="notificationBadge"
              style="display:none;"

          </button>

          <div
            id="notificationPanel"
            style="display:none;"
          >
            <div id="notificationPanelTitle">
              Upozornenia
            </div>

            <div id="notificationList"></div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

    <span class="for">For</span>
    <span class="all">All</span>
  </div>

  </div>

    <button
      class="lang-btn"
      id="skLangBtn"

    <button
      class="lang-btn"
      id="enLangBtn"

  </div>

      🎟️ Moje rezervácie

    <button
      class="menu-btn fatra"
      id="fatraBtn"

      class="menu-btn face"

      🎟️ Moje rezervácie
    </h2>

  </div>

  x.setAttribute('aria-atomic', 'true');

  x.textContent =

}

function money(v) {

  return new Intl.NumberFormat(
    'en-GB',
    {
      style: 'currency',
      currency: 'GBP'
    }
  ).format(
    Number(v || 0)
  );
}

function escapeHtml(v) {

  return String(v ?? '')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function formatDate(s) {

  if (!s) return '';

  return new Intl.DateTimeFormat(
    currentLanguage === 'sk'
      ? 'sk-SK'
      : 'en-GB',
    {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  ).format(
    new Date(
      s + 'T12:00:00'
    )
  );
}

function eventDays(e) {

  return Math.max(
    1,
    Math.round(
      (
        new Date(e.end_date) -
        new Date(e.start_date)
      ) / 86400000
    ) + 1
  );
}

function eventNights(e) {
  return Math.max(
    1,
    eventDays(e) - 1
  );
}

function getUsername(u) {

  return (
    u?.user_metadata
      ?.username
      ?.trim() ||
    ''
  );
}

  if (!e) return '';
  const value = currentLanguage === 'en' ? e.description_en : e.description_sk;

  return e.description || e.description_sk || e.description_en
    ? T('Slovenský preklad popisu zatiaľ nie je vyplnený.', 'The English description has not been filled in yet.') : '';
}
function cfaLocalizedEventTitle(e) {
  if (!e) return '';
  return currentLanguage === 'en'

async function updateUserButton() {
  const button = el('userTopBtn');
  if (!button) return;
  const user = currentUser;
  if (!user) { button.textContent = T('👤 Prihlásiť sa','👤 Sign in'); return; }
  function render(profile) {
    if (currentUser?.id !== user.id) return;
    const name = getUsername(currentUser) || profile?.display_name?.trim() || currentUser.email || T('Používateľ','User');
    button.replaceChildren();
    if (profile?.avatar_url) {
      const avatar = document.createElement('img'); avatar.src = profile.avatar_url; avatar.alt = ''; avatar.className = 'cfa-account-avatar'; button.append(avatar);
    } else { const icon = document.createElement('span'); icon.textContent = '👤'; icon.setAttribute('aria-hidden','true'); button.append(icon); }
    const label = document.createElement('span'); label.className = 'cfa-account-name'; label.textContent = name; button.append(label);
    button.setAttribute('aria-label', T('Účet: ','Account: ') + name);
    button.title = currentUser.email || name;
  }
  render(null);
  try {
    const { data, error } = await supabaseClient.from('user_profiles').select('avatar_url,display_name').eq('user_id',user.id).maybeSingle();
    if (!error) render(data);
  } catch (_) { /* Keep the signed-in account name when the avatar cannot be loaded. */ }
}

function fillAccount() {

  if (!currentUser) return;

  const username =
    el('accountUsername');

  const email =
    el('accountEmail');

  const input =
    el('accountUsernameInput');

  if (username) {
    username.textContent =
      getUsername(currentUser) ||
      T(
        'Používateľ',
        'User'
      );
  }

  if (email) {
    email.textContent =
      currentUser.email || '';
  }

  if (input) {
    input.value =
      getUsername(currentUser);
  }
}

  const { data } =
    await supabaseClient.auth

function makeCounter(
  label,
  initial,
  onChange,
  max = null
) {

  let count =
    initial;

  const line =
    document.createElement('div');

  line.className =
    'guest-counter';

  const lab =
    document.createElement('div');

  lab.className =
    'guest-counter-label';

  lab.textContent =
    label;

  const controls =
    document.createElement('div');

  controls.className =
    'guest-counter-controls';

  const minus =
    document.createElement('button');

  const value =
    document.createElement('span');

  const plus =
    document.createElement('button');

  minus.type =
    'button';

  plus.type =
    'button';

  minus.className =
    'guest-btn';

  plus.className =
    'guest-btn';

  minus.textContent =
    '−';

  plus.textContent =
    '+';

  value.className =
    'guest-count';

  value.textContent =
    count;

  minus.onclick =
    () => {

      if (count > 0) {

        count--;

        value.textContent =
          count;

        onChange(count);
      }
    };

  plus.onclick =
    () => {

      if (
        max !== null &&
        count >= max
      ) {
        return;
      }

      count++;

      value.textContent =
        count;

      onChange(count);
    };

  controls.append(
    minus,
    value,
    plus
  );

  line.append(
    lab,
    controls
  );

  return line;
}

function renderAgeInputs(
  container,
  ages,
  title,
  minAge = 0,
  maxAge = 17
) {

  container.innerHTML = '';

  if (!ages.length) {
    return;
  }

  const t =
    document.createElement('div');

  t.className =
    'small';

  t.innerHTML =
    '<b>' +
    title +
    '</b>';

  container.appendChild(t);

  ages.forEach(
    (age,i) => {

      const r =
        document.createElement('div');

      r.className =
        'child-age-row';

      const l =
        document.createElement('span');

      l.textContent =
        T(
          'Dieťa ' + (i + 1),
          'Child ' + (i + 1)
        );

      const input =
        document.createElement('input');

      input.type =
        'number';

      input.min =
        String(minAge);

      input.max =
        String(maxAge);

      input.inputMode =
        'numeric';

      input.value =
        age;

      input.required = true;
      input.step = '1';
      input.placeholder = T('Zadaj vek', 'Enter age');
      input.setAttribute('aria-label', T('Vek dieťaťa ', 'Child age ') + (i + 1));

      input.oninput =
        () => {

          ages[i] =
            input.value === ''
              ? ''
              : Number(
                  input.value
                );
        };

      r.append(
        l,
        input
      );

      container.appendChild(r);
    }
  );
}

function reservationControl(
  row,
  o,
  e
) {

  let q = 1;
  let adultCount =
    collectsGuests(o)

  let paidChildAges = [];
  let otherChildAges = [];

  const childMin =
    Number(

    );

  const childMax =
    Number(
      o.max_age ?? 17
    );

  let ticketAges =
    isChild(o)
      ? ['']
      : [];

  let capacityNote =
    null;

  let unitValue =
    null;

  function isSharedAccommodation() {

    return (
      o.option_code ===
      'shared_accommodation_adult'
    );
  }

  function accommodationUnitLabel() {

    if (
      o.option_code ===
      'small_tent' ||
      o.option_code ===
      'large_tent'
    ) {
      return T(
        'Počet stanov',
        'Number of tents'
      );
    }

    if (
      o.option_code ===
      'caravan_motorhome'
    ) {
      return T(
        'Počet vozidiel',
        'Number of vehicles'
      );
    }

    if (
      o.option_code ===
      'private_room_2'
    ) {
      return T(
        'Počet izieb',
        'Number of rooms'
      );
    }

    if (
      o.option_code ===
      'private_lodge_4'
    ) {
      return T(
        'Počet chatiek',
        'Number of lodges'
      );
    }

    return T(
      'Počet ubytovacích jednotiek',
      'Number of accommodation units'
    );
  }

  function accommodationUnitWord() {

    if (
      o.option_code ===
        'small_tent' ||
      o.option_code ===
        'large_tent'
    ) {

      return {
        skOne: 'stanu',
        skMany: 'stanoch',
        enOne: 'tent',
        enMany: 'tents'
      };
    }

    if (
      o.option_code ===
      'caravan_motorhome'
    ) {

      return {
        skOne: 'vozidla',
        skMany: 'vozidlách',
        enOne: 'vehicle',
        enMany: 'vehicles'
      };
    }

    if (
      o.option_code ===
      'private_room_2'
    ) {

      return {
        skOne: 'izby',
        skMany: 'izbách',
        enOne: 'room',
        enMany: 'rooms'
      };
    }

    if (
      o.option_code ===
      'private_lodge_4'
    ) {

      return {
        skOne: 'chatky',
        skMany: 'chatkách',
        enOne: 'lodge',
        enMany: 'lodges'
      };
    }

    return {
      skOne:
        'ubytovacej jednotky',
      skMany:
        'ubytovacích jednotkách',
      enOne:
        'accommodation unit',
      enMany:
        'accommodation units'
    };
  }

  function updateCapacityNote() {

    if (unitValue) {
      unitValue.textContent =
        q;
    }

    if (
      !capacityNote ||
      !o.max_occupancy
    ) {
      return;
    }

    const unitCapacity =
      Number(
        o.max_occupancy
      );

    const maxTotal =
      unitCapacity * q;

    const words =
      accommodationUnitWord();

    if (
      hasExtraFreeChildRule(o)
    ) {

      capacityNote.textContent =
        T(
          `Kapacita jedného ${words.skOne}: ${unitCapacity} osoby. Pri ${q} ${words.skMany} je maximálna kapacita lôžok ${maxTotal} osôb. Deti bez vlastného lôžka (max. 3) sa do tejto kapacity nepočítajú.`,
          `Capacity per ${words.enOne}: ${unitCapacity} people using beds. With ${q} ${words.enMany}, the maximum bed capacity is ${maxTotal} people. Children without their own bed (max. 3) do not count towards this capacity.`
        );

    } else {

      capacityNote.textContent =
        T(
          `Kapacita jedného ${words.skOne}: ${unitCapacity} osoby. Pri ${q} ${words.skMany} je maximálna kapacita ${maxTotal} osôb spolu.`,
          `Capacity per ${words.enOne}: ${unitCapacity} people. With ${q} ${words.enMany}, the maximum capacity is ${maxTotal} people in total.`
        );
    }
  }

  if (collectsGuests(o)) {

    const box =
      document.createElement('div');

    box.className =
      'guest-box';

    box.innerHTML =
      `<div class="guest-title">👥 ${

          'Hostia v tejto rezervácii',

  add.className =
    'add-btn';

  minus.textContent =
    '−';

  plus.textContent =
    '+';

  val.textContent =
    '1';

  add.textContent =
    T(
      'Pridať',
      'Add'
    );

  if (o.is_accommodation) {

    line.style.justifyContent =
      'flex-end';

    line.appendChild(add);

  } else {

    minus.onclick =
      () => {

        if (q > 1) {
          q--;
          val.textContent = q;
        }
      };

    plus.onclick =
      () => {
        q++;
        val.textContent = q;
      };

    line.append(
      minus,
      val,
      plus,
      add
    );
  }

  row.appendChild(line);

  let childBox =
    null;

  if (isChild(o)) {

    childBox =
      document.createElement('div');

    childBox.className =
      'child-box';

    row.appendChild(
      childBox
    );

    const renderTickets =
      () => {

        ticketAges =
          ticketAges.slice(
            0,
            q
          );

        while (
          ticketAges.length <
          q
        ) {
          ticketAges.push('');
        }

        renderAgeInputs(
          childBox,
          ticketAges,
          T(
            `Vek každého dieťaťa (${childMin}–${childMax} rokov):`,
            `Age of each child (${childMin}–${childMax} years):`
          ),
          childMin,
          childMax
        );
      };

    renderTickets();

    minus.onclick =
      () => {

        if (q > 1) {
          q--;
          val.textContent = q;
          renderTickets();
        }
      };

    plus.onclick =
      () => {
        q++;
        val.textContent = q;
        renderTickets();
      };
  }

  add.onclick =
    async () => {

      if (!requireLogin()) {
        return;
      }

      if (!cfaValidateChildAgeFields(row)) return;

      if (isTbd(o)) {

        return alert(
          T(
            'Cena tejto položky ešte nie je nastavená.',
            'The price for this item has not been set yet.'
          )
        );
      }

      const invalidGeneralAges =
        ages =>
          ages.some(
            a =>
              a === '' ||
              !Number.isInteger(
                Number(a)
              ) ||
              Number(a) < 0 ||
              Number(a) > 17
          );

      if (collectsGuests(o)) {

        const totalPeople =
          adultCount +
          paidChildAges.length +
          otherChildAges.length;

        const peopleUsingBeds =
          adultCount +
          paidChildAges.length;

        if (totalPeople < 1) {

          return alert(
            T(
              'Uveďte aspoň jedného hosťa.',
              'Please add at least one guest.'
            )
          );
        }

        if (
          invalidGeneralAges(
            paidChildAges
          ) ||
          invalidGeneralAges(
            otherChildAges
          )
        ) {

          return alert(
            T(
              'Zadajte vek každého dieťaťa od 0 do 17 rokov.',
              'Enter the age of every child from 0 to 17.'
            )
          );
        }

        if (
          hasExtraFreeChildRule(o) &&
          otherChildAges.length > 3
        ) {

          return alert(
            T(
              'Maximálne 3 deti bez vlastného lôžka sú povolené zdarma.',
              'A maximum of 3 children without their own bed are allowed free of charge.'
            )
          );
        }

        if (
          o.max_occupancy &&
          !isSharedAccommodation()
        ) {

          const allowed =
            Number(
              o.max_occupancy
            ) * q;

          const capacityPeople =
            hasExtraFreeChildRule(o)
              ? peopleUsingBeds
              : totalPeople;

          if (
            capacityPeople >
            allowed
          ) {

            if (
              hasExtraFreeChildRule(o)
            ) {

              return alert(
                T(
                  `Pri počte ${q} je maximálna kapacita lôžok ${allowed} osôb. Zadali ste ${peopleUsingBeds} osôb využívajúcich lôžko. Deti bez vlastného lôžka (max. 3) sa do tejto kapacity nepočítajú.`,
                  `With ${q} selected, the maximum bed capacity is ${allowed} people. You entered ${peopleUsingBeds} people using beds. Children without their own bed (max. 3) do not count towards this capacity.`
                )
              );
            }

            return alert(
              T(
                `Pri počte ${q} je maximálna kapacita tohto ubytovania ${allowed} osôb spolu. Zadali ste ${totalPeople} osôb.`,
                `With ${q} selected, the maximum capacity of this accommodation is ${allowed} people in total. You entered ${totalPeople} people.`
              )
            );
          }
        }
      }

      if (isChild(o)) {

        const invalidTicketAges =
          ticketAges.some(
            a =>
              a === '' ||
              !Number.isInteger(
                Number(a)
              ) ||
              Number(a) <
                childMin ||
              Number(a) >
                childMax
          );

        if (invalidTicketAges) {

          return alert(
            T(
              `Pre túto položku musí byť vek každého dieťaťa od ${childMin} do ${childMax} rokov.`,
              `For this option, every child must be between ${childMin} and ${childMax} years old.`
            )
          );
        }
      }

      add.disabled =
        true;

      add.textContent =
        T(
          'Pridávam…',
          'Adding…'
        );

      let error =
        null;

      if (
        collectsGuests(o) &&
        o.is_accommodation
      ) {

        const result =
          await supabaseClient.rpc(
            'add_accommodation_to_cart',
            {
              p_event_option_id:
                o.id,

              p_quantity:
                isSharedAccommodation()
                  ? 1
                  : q,

              p_adult_count:
                adultCount,

              p_paid_child_ages:
                isBedAccommodation(o)
                  ? paidChildAges.map(Number)
                  : [],

              p_free_child_ages:
                otherChildAges.map(Number),

              p_number_of_nights:
                isNightPricing(o)
                  ? eventNights(e)
                  : 1
            }
          );

        error =
          result.error;

      } else {

        const result =
          await supabaseClient.rpc(
            'add_item_to_cart',
            {
              p_event_option_id:
                o.id,

              p_quantity:
                q,

              p_child_ages:
                isChild(o)
                  ? ticketAges.map(Number)
                  : [],

              p_number_of_days:
                isDayPricing(o)
                  ? eventDays(e)
                  : 1,

              p_number_of_nights:
                isNightPricing(o)
                  ? eventNights(e)
                  : 1,

              p_option_date:
                isDayPricing(o)
                  ? e.start_date
                  : null,

              p_adult_count:
                0
            }
          );

        error =
          result.error;
      }

      add.disabled =
        false;

      add.textContent =
        T(
          'Pridať',
          'Add'
        );

      if (error) {

        return alert(
          T(
            'Nepodarilo sa pridať položku: ',
            'Could not add item: '
          ) +
          error.message
        );
      }

      await refreshCartBadge();

      alert(
        T(
          'Položka bola pridaná do košíka.',
          'Item added to cart.'
        )
      );
    };
}

async function getActiveCart() {

  if (!currentUser) {
    return null;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from('bookings')
      .select('*')
      .eq(
        'user_id',
        currentUser.id
      )
      .eq(
        'status',
        'cart'
      )
      .order(
        'created_at',
        {
          ascending: false
        }
      )
      .limit(1)
      .maybeSingle();

  if (error) {

    alert(
      'GET CART ERROR:\n' +
      (
        error.message ||
        'Unknown error'
      ) +
      '\n\nUser ID:\n' +
      currentUser.id
    );

    console.error(
      'getActiveCart error:',
      error
    );

    return null;
  }

  return data || null;
}

async function getCartItems(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from('booking_items')
      .select(
        '*,event_options(option_code,name,name_sk,name_en,is_accommodation,free_with_accommodation,booking_form_settings,requires_linked_tickets,min_age,max_age,category,price,is_free,admission_type)'
      )
      .eq(
        'booking_id',
        id
      )
      .order('created_at');

  if (error) {

    alert(
      'GET CART ITEMS ERROR:\n' +
      (
        error.message ||
        'Unknown error'
      ) +
      '\n\nBooking ID:\n' +
      id
    );

    console.error(
      'getCartItems error:',
      error
    );

    return [];
  }

  return data || [];
}

async function refreshCartBadge() {

  const badge =
    el('cartBadge');

  if (!badge) {
    return;
  }

  if (!currentUser) {

    badge.style.display =
      'none';

    badge.textContent =
      '0';

    activeCart =
      null;

    return;
  }

  const cart =
    await getActiveCart();

  activeCart =
    cart;

  if (!cart) {

    badge.style.display =
      'none';

    badge.textContent =
      '0';

    return;
  }

  const items =
    await getCartItems(
      cart.id
    );

  const count =
    items.reduce(
      (s,i) =>
        s +
        Number(
          i.quantity || 1
        ),
      0
    );

  badge.textContent =
    String(count);

  badge.style.display =
    count
      ? 'flex'
      : 'none';
}

function guestCartHtml(i) {

  let h = '';

  const code =
    i.event_options
      ?.option_code ||
    '';

  if (
    Number(
      i.adult_count || 0
    ) > 0
  ) {

    h +=
      `<div class="small">${
        T(
          'Dospelí: ',
          'Adults: '
        )
      }${i.adult_count}</div>`;
  }

  if (
    Number(
      i.paid_child_count || 0
    ) > 0
  ) {

    h +=
      `<div class="small">${
        T(
          'Deti – vlastné lôžko: ',
          'Children – own bed: '
        )
      }${i.paid_child_count}<br>${
        T(
          'Vek: ',
          'Ages: '
        )
      }${
        escapeHtml(
          (
            i.paid_child_ages ||
            []
          ).join(', ')
        )
      }</div>`;
  }

  if (
    Number(
      i.free_child_count || 0
    ) > 0
  ) {

    const label =
      isCamping({
        option_code: code
      })
        ? T(
            'Deti: ',
            'Children: '
          )
        : T(
            'Deti – bez vlastného lôžka: ',
            'Children – without own bed: '
          );

    h +=
      `<div class="small">${label}${i.free_child_count}<br>${
        T(
          'Vek: ',
          'Ages: '
        )
      }${
        escapeHtml(
          (
            i.free_child_ages ||
            []
          ).join(', ')
        )
      }</div>`;
  }

  if (
    !i.paid_child_count &&
    !i.free_child_count &&
    i.child_ages?.length
  ) {

    h +=
      `<div class="small">${
        T(
          'Deti – vek: ',
          'Children – ages: '
        )
      }${
        escapeHtml(
          i.child_ages.join(', ')
        )
      }</div>`;
  }

  if (
    code === 'day_parking' &&
    Number(i.line_total) === 0
  ) {

    h +=
      `<div class="small" style="color:#86efac;font-weight:700">${
        T(
          'Parkovanie zdarma k ubytovaniu',
          'Free parking with accommodation'
        )
      }</div>`;
  }

  return h;
}

        escapeHtml(

  items.forEach(i => {

    const d =
      document.createElement('div');

    d.className =
      'cart-item';

    d.innerHTML = `
      <div class="cart-item-line">

        <div>
          <b>
            ${escapeHtml(i.quantity)}×
            ${escapeHtml(i.item_name)}
          </b>

          <br>

          ${money(i.line_total)}

          ${
            T(
              'Odstrániť',
              'Remove'
            )
          }
        </button>

      </div>
    `;

    d.querySelector('button')
      .onclick =
        () =>
          removeCartItem(
            i.id
          );

    box.appendChild(d);
  });

  const total =
    document.createElement('div');

  total.className =
    'cart-total';

  total.textContent =
    T(
      'Spolu: ',
      'Total: '
    ) +
    money(
      activeCart
        ?.total_amount
    );

  if (activeCart?.discount_code_id) {
    const summary = document.createElement('div');
    summary.id = 'cfaCartDiscountSummary';
    const subtotalLine = document.createElement('div');
    subtotalLine.textContent = T('Medzisúčet: ', 'Subtotal: ') + money(activeCart.subtotal_amount);
    const discountLine = document.createElement('div');
    discountLine.textContent = T('Zľava: −', 'Discount: −') + money(activeCart.discount_amount);
    summary.append(subtotalLine, discountLine);
    box.appendChild(summary);
  }

  box.appendChild(total);

  const actions =
    document.createElement('div');

  actions.className =
    'cart-actions';

  const cont =
    document.createElement('button');

  cont.className =
    'secondary-btn';

  cont.textContent =
    T(
      '← Pokračovať v rezervácii',
      '← Continue reservation'
    );

    () => {

        activeCart?.event_id
      ) {

        );

        showEvents();
      }
    };

  const checkout =
    document.createElement('button');

    'checkout-btn';

  checkout.disabled =
    true;

    T(
      'Prejsť k platbe – čoskoro',

    );

  actions.append(
    cont,
    checkout
  );

  box.appendChild(actions);

  el('cartPageContent')
    .innerHTML = '';

  el('cartPageContent')
    .appendChild(box);

  startCountdowns();

  refreshCartBadge();
}

    )

  const {

function startCountdowns() {

  clearInterval(
    countdownTimer
  );

  const tick =
    () => {

      document
        .querySelectorAll(
          '.countdown'
        )
        .forEach(x => {

          const exp =
            x.dataset.exp;

          if (!exp) {
            x.textContent = '';
            return;
          }

          const t =
            new Date(exp)
              .getTime() -
            Date.now();

          if (t <= 0) {

            x.textContent =
              T(
                'Čas košíka vypršal.',
                'Cart time expired.'
              );

            return;
          }

          const m =
            Math.floor(
              t / 60000
            );

          const s =
            Math.floor(
              (t % 60000) /
              1000
            );

          x.textContent =
            T(
              'Rezervované ešte: ',
              'Reserved for: '
            ) +
            m +
            ':' +
            String(s)
              .padStart(
                2,
                '0'
              );
        });
    };

  tick();

  countdownTimer =
    setInterval(
      tick,
      1000
    );
}

function cfaBookingCreatedAt(value) {
  const time = document.createElement('time'); time.className = 'cfa-booking-created-at';
  const date = new Date(value);
  if (!value || !Number.isFinite(date.getTime())) { time.textContent = T('Dátum vytvorenia nie je dostupný.','Creation date is unavailable.'); return time; }
  time.dateTime = date.toISOString();
  time.textContent = T('Vytvorené: ','Created: ') + new Intl.DateTimeFormat(currentLanguage === 'en' ? 'en-GB' : 'sk-SK',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(date) + T(' (čas Spojeného kráľovstva)',' (UK time)');
  return time;
}

async function saveUsername() {

    data,
    error
  } =
    await supabaseClient.auth
      .updateUser({
        data: {
          username:
            el('accountUsernameInput')
              .value
              .trim()
        }
      });

      'usernameMessage',
      T(
        'Používateľské meno sa nepodarilo uložiť.',
        'Username could not be saved.'
      ),
      'error'
    );
  }

  currentUser =
    data.user;

  fillAccount();

  await updateUserButton();

  showMessage(
    'usernameMessage',
    T(
      'Používateľské meno bolo uložené.',
      'Username has been saved.'
    ),
    'success'
  );
}

async function logoutUser() {

  // Unregister this device for the account before ending its session.
  if (currentUser && typeof removeAndroidFirebaseToken === 'function') {
    await removeAndroidFirebaseToken(currentUser.id);
  }

  if (currentUser && typeof window.cfaWebPushUnregister === 'function') {
    await window.cfaWebPushUnregister(currentUser.id);
  }

  const { error: signOutError } = await supabaseClient.auth.signOut();
  if (signOutError) {
    console.error('Sign out failed:', signOutError);
    return;
  }

  currentUser = null;
  activeCart = null;

  await updateUserButton();
  await refreshCartBadge();

  showHome();
}

async function sendForm(

  url,
  sk,
  en
) {

        headers: {
          Accept:
            'application/json'
        }

  showMessage(

          'Sending failed.'

      ? 'success'
      : 'error'
  );

    form.reset();
  }
}

<script>
/* ===== PASSWORD SHOW / HIDE ===== */

function addPasswordEye(
  inputId
) {

  const input =
    document.getElementById(
      inputId
    );

  if (
    !input ||
    input.dataset.eyeAdded ===
      'true'
  ) {
    return;
  }

  input.dataset.eyeAdded =
    'true';

  const wrapper =
    document.createElement('div');

  wrapper.style.cssText =
    'position:relative;width:100%;';

  input.parentNode
    .insertBefore(
      wrapper,
      input
    );

  wrapper.appendChild(
    input
  );

  input.style.paddingRight =
    '48px';

  const eye =
    document.createElement('button');

  eye.type =
    'button';

  eye.textContent =
    '👁️';

  eye.setAttribute(
    'aria-label',
    'Show or hide password'
  );

  eye.style.cssText =
    'position:absolute;right:8px;top:50%;transform:translateY(-50%);' +
    'border:0;background:transparent;color:white;font-size:20px;' +
    'padding:6px;cursor:pointer;';

  eye.addEventListener(
    'click',
    () => {

      input.type =
        input.type ===
          'password'
          ? 'text'
          : 'password';

      eye.textContent =
        input.type ===
          'password'
          ? '👁️'
          : '🙈';
    }
  );

  wrapper.appendChild(
    eye
  );
}

[
  'loginPassword',
  'registerPassword',
  'registerPassword2',
  'newPassword',
  'newPassword2'
].forEach(
  addPasswordEye
);
</script>

<script>
/* ===== PASSWORD RECOVERY URL FIX ===== */

(function () {

  let recoveryLocked =
    false;

  function openRecoveryScreen() {

    recoveryLocked =
      true;

    if (
      typeof hidePages ===
      'function'
    ) {
      hidePages();
    }

    const resetPage =
      document.getElementById(
        'resetPage'
      );

    if (resetPage) {
      resetPage.style.display =
        'block';
    }

    document
      .getElementById(
        'newPassword'
      )
      ?.focus();
  }

  supabaseClient.auth
    .onAuthStateChange(
      (
        event,
        session
      ) => {

        if (
          event ===
          'PASSWORD_RECOVERY'
        ) {

          sessionStorage
            .setItem(
              'passwordRecoveryPending',
              'true'
            );

          currentUser =
            session?.user ||
            null;

          openRecoveryScreen();
        }
      }
    );

  if (
    location.hash.includes(
      'type=recovery'
    ) ||
    location.search.includes(
      'type=recovery'
    )
  ) {

    sessionStorage
      .setItem(
        'passwordRecoveryPending',
        'true'
      );
  }

  if (
    sessionStorage.getItem(
      'passwordRecoveryPending'
    ) ===
    'true'
  ) {
    openRecoveryScreen();
  }

  const originalShowHome =
    window.showHome;

  window.showHome =
    function () {

      if (
        recoveryLocked ||
        sessionStorage.getItem(
          'passwordRecoveryPending'
        ) ===
        'true'
      ) {

        openRecoveryScreen();
        return;
      }

      return originalShowHome
        .apply(
          this,
          arguments
        );
    };

  const resetForm =
    document.getElementById(
      'resetForm'
    );

  if (resetForm) {

    resetForm.onsubmit =
      async function (e) {

        e.preventDefault();

        const password =
          document
            .getElementById(
              'newPassword'
            )
            ?.value ||
          '';

        const password2 =
          document
            .getElementById(
              'newPassword2'
            )
            ?.value ||
          '';

        if (
          password !==
          password2
        ) {

          showMessage(
            'resetMessage',
            T(
              'Heslá sa nezhodujú.',
              'Passwords do not match.'
            ),
            'error'
          );

          return;
        }

        const {
          error
        } =
          await supabaseClient.auth
            .updateUser({
              password
            });

        if (error) {

          showMessage(
            'resetMessage',
            error.message,
            'error'
          );

          return;
        }

        recoveryLocked =
          false;

        sessionStorage
          .removeItem(
            'passwordRecoveryPending'
          );

        history.replaceState(
          {},
          document.title,
          location.pathname
        );

        showMessage(
          'resetMessage',
          T(
            'Nové heslo bolo uložené.',
            'Your new password has been saved.'
          ),
          'success'
        );

        setTimeout(
          () => {
            originalShowHome();
          },
          1200
        );
      };
  }

})();
</script>

        function () {

          if (
            history.state
              ?.cfaView &&
            history.length > 1
          ) {
            history.back();
          } else {
            showHome();
          }
        };
    }

    document
      .getElementById(
        'privateUserSearch'
      )
      ?.addEventListener(
        'input',
        renderPrivateUsers
      );

    updatePrivateMessagesLanguage();
  }

  function updatePrivateMessagesLanguage() {

    const button =
      document.getElementById(
        'privateMessagesBtn'
      );

    if (button) {

      button.textContent =
        currentLanguage ===
          'en'
          ? '💬 Private Messages'
          : '💬 Súkromné správy';
    }

    const back =
      document.getElementById(
        'privateUsersBackBtn'
      );

    if (back) {

      back.textContent =
        currentLanguage ===
          'en'
          ? '← Back'
          : '← Späť';
    }

    const title =
      document.getElementById(
        'privateUsersTitle'
      );

    if (title) {

      title.textContent =
        currentLanguage ===
          'en'
          ? '💬 Private Messages'
          : '💬 Súkromné správy';
    }

    const search =
      document.getElementById(
        'privateUserSearch'
      );

    if (search) {

      search.placeholder =
        currentLanguage ===
          'en'
          ? 'Search users...'
          : 'Hľadať používateľa...';
    }
  }

  async function openPrivateUsers() {

    if (!requireLogin()) {
      return;
    }

    hidePages();

    const container =
      document.querySelector(
        '.container'
      );

    if (container) {
      container.style.display =
        '';
    }

    const chatPage =
      document.getElementById(
        'chatPage'
      );

    if (chatPage) {
      chatPage.style.display =
        'none';
    }

    const privateChatPage =
      document.getElementById(
        'privateChatPage'
      );

    if (privateChatPage) {
      privateChatPage.style.display =
        'none';
    }

    const page =
      document.getElementById(
        'privateUsersPage'
      );

    if (!page) return;

    page.style.display =
      'block';

    window.scrollTo(
      0,
      0
    );

    privateUsersLimit=30;
    await window.CFAQuickChat?.refreshNow();
    await loadPrivateUsers();
  }

  window.openPrivateUsers =
    openPrivateUsers;

  async function loadPrivateUsers() {

    const list =
      document.getElementById(
        'privateUsersList'
      );

    if (
      !list ||
      !currentUser
    ) {
      return;
    }

    list.innerHTML =
      `<div class="loading">${
        currentLanguage === 'en'
          ? 'Loading users...'
          : 'Načítavam používateľov...'
      }</div>`;

    const {
      data,
      error
    } =
      await supabaseClient
        .from('user_profiles')
        .select(
          'user_id,display_name,avatar_url,presence_status,last_active_at'
        )
        .neq(
          'user_id',
          currentUser.id
        )
        .order(
          'display_name',
          {
            ascending: true
          }
        );

    if (error) {

      list.innerHTML =
        `<div>${
          currentLanguage ===
            'en'
            ? 'Users could not be loaded.'
            : 'Používateľov sa nepodarilo načítať.'
        }</div>`;

      return;
    }

    window.privateUsers =
      data || [];

    renderPrivateUsers();
  }

  /*
    DÔLEŽITÉ:
    Avatar kód je v inom scope.
    Preto sprístupníme bezpečnú verejnú
    referenciu na túto funkciu.
  */

  window.loadPrivateUsers =
    loadPrivateUsers;

  let privateUsersPresenceChannel =
    null;

  function startPrivateUsersPresenceRealtime() {

    if (
      privateUsersPresenceChannel
    ) {

      supabaseClient
        .removeChannel(
          privateUsersPresenceChannel
        );
    }

    privateUsersPresenceChannel =
      supabaseClient
        .channel(
          'private-users-presence'
        )
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'user_profiles'
          },
          async () => {

            if (
              currentUser
            ) {
              await loadPrivateUsers();
            }
          }
        )
        .subscribe();
  }

  let privateUsersLimit = 30, privateUsersLastQuery = "";
  function renderPrivateUsers() {

    const list =
      document.getElementById(
        'privateUsersList'
      );

    if (!list) return;

    const query =
      (
        document
          .getElementById(
            'privateUserSearch'
          )
          ?.value ||
        ''
      )
        .trim()
        .toLowerCase();

    if (query !== privateUsersLastQuery) { privateUsersLimit=30;privateUsersLastQuery=query; }

    const priority = {
      online: 0,
      logged_in: 1,
      offline: 2
    };

    const users =
      window.privateUsers
        .filter(
          user =>
            (
              user.display_name ||
              ''
            )
              .toLowerCase()
              .includes(query)
        )
        .sort(
          (a,b) => {

            const recentA = window.CFAQuickChat?.recent?.get(a.user_id)?.time || 0;
            const recentB = window.CFAQuickChat?.recent?.get(b.user_id)?.time || 0;
            if (recentA !== recentB) return recentB - recentA;

            const statusA =
              priority[
                a.presence_status
              ] ?? 2;

            const statusB =
              priority[
                b.presence_status
              ] ?? 2;

            if (
              statusA !==
              statusB
            ) {

              return (
                statusA -
                statusB
              );
            }

            return (
              a.display_name ||
              ''
            ).localeCompare(
              b.display_name ||
                '',
              currentLanguage ===
                'sk'
                ? 'sk'
                : 'en'
            );
          }
        );

    list.innerHTML = '';

    if (!users.length) {

      const empty =
        document.createElement(
          'div'
        );

      empty.style.padding =
        '15px 0';

      empty.textContent =
        currentLanguage ===
          'en'
          ? 'No users found.'
          : 'Nenašli sa žiadni používatelia.';

      list.appendChild(
        empty
      );

      return;
    }

    users.slice(0,privateUsersLimit).forEach(
      user => {

        const row =
          document.createElement(
            'button'
          );

        row.type =
          'button';

        row.style.cssText = `
          width:100%;
          display:flex;
          align-items:center;
          gap:14px;
          padding:12px;
          margin:8px 0;
          text-align:left;
          border:1px solid #334155;
          border-radius:12px;
          background:#172033;
          color:white;
          cursor:pointer;
        `;

        const avatar =
          document.createElement(
            'div'
          );

        avatar.style.cssText = `
          width:52px;
          height:52px;
          min-width:52px;
          border-radius:50%;
          overflow:hidden;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#334155;
          font-size:27px;
        `;

        if (user.avatar_url) {

          const img =
            document.createElement(
              'img'
            );

          img.src =
            user.avatar_url;

          img.alt =
            '';

          img.style.cssText = `
            width:100%;
            height:100%;
            object-fit:cover;
          `;

          avatar.appendChild(
            img
          );

        } else {

          avatar.textContent =
            '👤';
        }

        const details =
          document.createElement(
            'div'
          );

        details.style.cssText = `
          min-width:0;
          flex:1;
        `;

        const name =
          document.createElement(
            'div'
          );

        name.style.fontWeight =
          '800';

        name.style.fontSize =
          '16px';

        name.textContent =
          user.display_name ||
          'User';

        const status =
          document.createElement(
            'div'
          );

        status.style.cssText = `
          margin-top:3px;
          font-size:12px;
          font-weight:700;
        `;

        if (
          user.presence_status ===
          'online'
        ) {

          status.textContent =
            'Online';

          status.style.color =
            '#22c55e';

        } else if (
          user.presence_status ===
          'logged_in'
        ) {

          status.textContent =
            currentLanguage ===
              'en'
              ? 'Logged in'
              : 'Prihlásený';

          status.style.color =
            '#f59e0b';

        } else {

          status.textContent =
            'Offline';

          status.style.color =
            '#ef4444';
        }

        details.append(
          name,
          status
        );

        row.append(
          avatar,
          details
        );

                row.onclick =
          async function () {

            window.selectedPrivateUser =
              user;

            try {
              if (
                typeof window.openPrivateChatWithUser !==
                'function'
              ) {
                throw new Error(
                  'PRIVATE_CHAT_FUNCTION_MISSING'
                );
              }

              await window.openPrivateChatWithUser(
                user
              );

            } catch (error) {
              console.error(
                'Private chat opening error:',
                error
              );

              alert(
                'Chyba súkromného chatu / Private chat error:\n' +
                (error?.message || String(error))
              );
            }
          };

        list.appendChild(
          row
        );
        window.CFASafety?.decorateUser(row,user);
      }
    );
    if(users.length>privateUsersLimit){
      const more=document.createElement('button');more.type='button';more.id='privateUsersMore';more.className='back-btn';
      more.textContent=(currentLanguage==='en'?'Show more contacts':'Zobraziť ďalšie kontakty')+' ('+Math.min(privateUsersLimit,users.length)+' / '+users.length+')';
      more.onclick=()=>{const focusIndex=privateUsersLimit;privateUsersLimit+=30;renderPrivateUsers();const rows=list.querySelectorAll('.cfa-contact-row>button:first-child');rows[focusIndex]?.focus({preventScroll:true});};list.append(more);
    }

  }

  window.renderPrivateUsers = renderPrivateUsers;

  const privateMessagesOriginalLanguage =
    window.setLanguage;

  window.setLanguage =
    function (lang) {

      privateMessagesOriginalLanguage
        .apply(
          this,
          arguments
        );

      setTimeout(
        () => {

          updatePrivateMessagesLanguage();

          if (
            document
              .getElementById(
                'privateUsersPage'
              )
              ?.style.display ===
            'block'
          ) {
            renderPrivateUsers();
          }
        },
        0
      );
    };

  createPrivateMessagesButton();
  createPrivateUsersPage();
  startPrivateUsersPresenceRealtime();

})();
</script>

<script>
/* ===== PRIVATE USERS – MOVE INTO CHAT ===== */

(function () {

  function movePrivateUsersIntoChat() {

    const oldButton =
      document.getElementById(
        'privateMessagesBtn'
      );

    if (oldButton) {
      oldButton.style.display =
        'none';
    }

    if (
      !document.getElementById(
        'chatUsersBtn'
      )
    ) {

      const chatTitle =
        document.querySelector(
          '.chat-title'
        );

      if (!chatTitle) {
        return;
      }

      const usersButton =
        document.createElement(
          'button'
        );

      usersButton.id =
        'chatUsersBtn';

      usersButton.type =
        'button';

      usersButton.textContent =
        '👥';

      usersButton.setAttribute(
        'aria-label',
        currentLanguage ===
          'en'
          ? 'Users'
          : 'Používatelia'
      );

      usersButton.style.cssText = `
        border:0;
        background:transparent;
        color:white;
        font-size:25px;
        padding:6px 9px;
        cursor:pointer;
        position:relative;
      `;

      usersButton.onclick =
        function () {

          if (
            typeof window
              .openPrivateUsers ===
            'function'
          ) {

            window
              .openPrivateUsers();
          }
        };

      chatTitle
        .insertAdjacentElement(
          'afterend',
          usersButton
        );
    }
  }

  movePrivateUsersIntoChat();

  const originalOpenCommunityChatUsers =
    window.openCommunityChat;

  if (
    typeof originalOpenCommunityChatUsers ===
    'function'
  ) {

    window.openCommunityChat =
      async function () {

        const result =
          await originalOpenCommunityChatUsers
            .apply(
              this,
              arguments
            );

        movePrivateUsersIntoChat();

        return result;
      };
  }

  const originalUsersLanguage =
    window.setLanguage;

  window.setLanguage =
    function (lang) {

      originalUsersLanguage
        .apply(
          this,
          arguments
        );

      const button =
        document.getElementById(
          'chatUsersBtn'
        );

      if (button) {

        button.setAttribute(
          'aria-label',
          lang === 'en'
            ? 'Users'
            : 'Používatelia'
        );
      }
    };

})();
</script>

<script>
/* ===== PROFILE AVATAR – CROP, RESIZE, SAVE, CHANGE, DELETE ===== */

(function () {

  let avatarFile =
    null;

  let avatarImage =
    null;

  let avatarScale =
    1;

  let avatarX =
    0;

  let avatarY =
    0;

  let dragging =
    false;

  let dragStartX =
    0;

  let dragStartY =
    0;

  let imageStartX =
    0;

  let imageStartY =
    0;

  function A(sk,en) {

    return currentLanguage ===
      'en'
      ? en
      : sk;
  }

  function createAvatarEditor() {

    if (
      document.getElementById(
        'avatarCropOverlay'
      )
    ) {
      return;
    }

    const overlay =
      document.createElement(
        'div'
      );

    overlay.id =
      'avatarCropOverlay';

    overlay.style.cssText = `
      display:none;
      position:fixed;
      inset:0;
      z-index:99999;
      background:rgba(0,0,0,.88);
      align-items:center;
      justify-content:center;
      padding:20px;
    `;

    overlay.innerHTML = `
      <div style="
        width:100%;
        max-width:390px;
        background:#1e293b;
        border:1px solid #475569;
        border-radius:18px;
        padding:20px;
        text-align:center;
      ">

        <h3
          id="avatarCropTitle"
          style="margin-top:0;"
        ></h3>

        <div
          id="avatarCropHelp"
          style="
            color:#cbd5e1;
            font-size:13px;
            margin-bottom:15px;
          "
        ></div>

        <div style="
          width:280px;
          height:280px;
          max-width:100%;
          margin:auto;
          position:relative;
        ">

          <canvas
            id="avatarCropCanvas"
            width="280"
            height="280"
            style="
              width:280px;
              height:280px;
              max-width:100%;
              border-radius:50%;
              background:#0f172a;
              touch-action:none;
              cursor:grab;
            "
          ></canvas>

        </div>

        <div style="margin-top:18px;">

          <div
            id="avatarZoomLabel"
            style="
              font-size:13px;
              color:#cbd5e1;
              margin-bottom:7px;
            "
          ></div>

          <input
            id="avatarZoom"
            type="range"
            min="1"
            max="3"
            step="0.01"
            value="1"
          >

        </div>

        <div style="
          display:grid;
          grid-template-columns:1fr 1fr;
          gap:10px;
          margin-top:18px;
        ">

          <button
            id="avatarCropCancel"
            type="button"
            class="secondary-btn"
          ></button>

          <button
            id="avatarCropSave"
            type="button"
            class="submit-btn"
            style="margin:0;"
          ></button>

        </div>

      </div>
    `;

    document.body
      .appendChild(
        overlay
      );

    const canvas =
      document.getElementById(
        'avatarCropCanvas'
      );

    const zoom =
      document.getElementById(
        'avatarZoom'
      );

    zoom.addEventListener(
      'input',
      function () {

        avatarScale =
          Number(
            this.value
          );

        keepAvatarInside();
        drawAvatarCrop();
      }
    );

    function pointerStart(e) {

      if (!avatarImage) {
        return;
      }

      dragging =
        true;

      canvas
        .setPointerCapture?.(
          e.pointerId
        );

      dragStartX =
        e.clientX;

      dragStartY =
        e.clientY;

      imageStartX =
        avatarX;

      imageStartY =
        avatarY;

      canvas.style.cursor =
        'grabbing';
    }

    function pointerMove(e) {

      if (
        !dragging ||
        !avatarImage
      ) {
        return;
      }

      avatarX =
        imageStartX +
        (
          e.clientX -
          dragStartX
        );

      avatarY =
        imageStartY +
        (
          e.clientY -
          dragStartY
        );

      keepAvatarInside();
      drawAvatarCrop();
    }

    function pointerEnd(e) {

      dragging =
        false;

      canvas
        .releasePointerCapture?.(
          e.pointerId
        );

      canvas.style.cursor =
        'grab';
    }

    canvas.addEventListener(
      'pointerdown',
      pointerStart
    );

    canvas.addEventListener(
      'pointermove',
      pointerMove
    );

    canvas.addEventListener(
      'pointerup',
      pointerEnd
    );

    canvas.addEventListener(
      'pointercancel',
      pointerEnd
    );

    document
      .getElementById(
        'avatarCropCancel'
      )
      .onclick =
        closeAvatarEditor;

    document
      .getElementById(
        'avatarCropSave'
      )
      .onclick =
        saveCroppedAvatar;

    updateAvatarEditorLanguage();
  }

  function updateAvatarEditorLanguage() {

    const title =
      document.getElementById(
        'avatarCropTitle'
      );

    const help =
      document.getElementById(
        'avatarCropHelp'
      );

    const zoom =
      document.getElementById(
        'avatarZoomLabel'
      );

    const cancel =
      document.getElementById(
        'avatarCropCancel'
      );

    const save =
      document.getElementById(
        'avatarCropSave'
      );

    if (title) {

      title.textContent =
        A(
          'Upraviť profilovú fotku',
          'Edit profile photo'
        );
    }

    if (help) {

      help.textContent =
        A(
          'Posuňte fotografiu prstom alebo myšou a nastavte priblíženie.',
          'Move the photo with your finger or mouse and adjust the zoom.'
        );
    }

    if (zoom) {

      zoom.textContent =
        A(
          'Priblíženie',
          'Zoom'
        );
    }

    if (cancel) {

      cancel.textContent =
        A(
          'Zrušiť',
          'Cancel'
        );
    }

    if (save) {

      save.textContent =
        A(
          'Uložiť',
          'Save'
        );
    }
  }

  function openAvatarEditor(file) {

    avatarFile =
      file;

    const reader =
      new FileReader();

    reader.onload =
      function (event) {

        const img =
          new Image();

        img.onload =
          function () {

            avatarImage =
              img;

            const canvasSize =
              280;

            const baseScale =
              Math.max(
                canvasSize /
                  img.width,

                canvasSize /
                  img.height
              );

            avatarScale =
              1;

            avatarX =
              (
                canvasSize -
                img.width *
                baseScale
              ) / 2;

            avatarY =
              (
                canvasSize -
                img.height *
                baseScale
              ) / 2;

            document
              .getElementById(
                'avatarZoom'
              )
              .value =
                '1';

            document
              .getElementById(
                'avatarCropOverlay'
              )
              .style.display =
                'flex';

            drawAvatarCrop();
          };

        img.src =
          event.target.result;
      };

    reader.readAsDataURL(
      file
    );
  }

  function closeAvatarEditor() {

    const overlay =
      document.getElementById(
        'avatarCropOverlay'
      );

    if (overlay) {

      overlay.style.display =
        'none';
    }

    avatarFile =
      null;

    avatarImage =
      null;
  }

  function avatarBaseScale() {

    if (!avatarImage) {
      return 1;
    }

    return Math.max(
      280 /
        avatarImage.width,

      280 /
        avatarImage.height
    );
  }

  function keepAvatarInside() {

    if (!avatarImage) {
      return;
    }

    const scale =
      avatarBaseScale() *
      avatarScale;

    const width =
      avatarImage.width *
      scale;

    const height =
      avatarImage.height *
      scale;

    const minX =
      280 - width;

    const minY =
      280 - height;

    avatarX =
      Math.min(
        0,
        Math.max(
          minX,
          avatarX
        )
      );

    avatarY =
      Math.min(
        0,
        Math.max(
          minY,
          avatarY
        )
      );
  }

  function drawAvatarCrop() {

    if (!avatarImage) {
      return;
    }

    const canvas =
      document.getElementById(
        'avatarCropCanvas'
      );

    if (!canvas) {
      return;
    }

    const ctx =
      canvas.getContext(
        '2d'
      );

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const scale =
      avatarBaseScale() *
      avatarScale;

    ctx.drawImage(
      avatarImage,
      avatarX,
      avatarY,
      avatarImage.width *
        scale,
      avatarImage.height *
        scale
    );
  }

  async function saveCroppedAvatar() {

    if (
      !avatarImage ||
      !currentUser
    ) {
      return;
    }

    const saveButton =
      document.getElementById(
        'avatarCropSave'
      );

    const message =
      document.getElementById(
        'profileAvatarMessage'
      );

    if (saveButton) {

      saveButton.disabled =
        true;

      saveButton.textContent =
        A(
          'Ukladám...',
          'Saving...'
        );
    }

    if (message) {

      message.textContent =
        A(
          'Ukladám profilovú fotografiu...',
          'Saving profile photo...'
        );
    }

    const sourceCanvas =
      document.getElementById(
        'avatarCropCanvas'
      );

    const output =
      document.createElement(
        'canvas'
      );

    output.width =
      500;

    output.height =
      500;

    const outputCtx =
      output.getContext(
        '2d'
      );

    outputCtx.drawImage(
      sourceCanvas,
      0,
      0,
      280,
      280,
      0,
      0,
      500,
      500
    );

    const blob =
      await new Promise(
        resolve => {

          output.toBlob(
            resolve,
            'image/jpeg',
            0.88
          );
        }
      );

    if (!blob) {

      if (message) {

        message.textContent =
          A(
            'Fotografiu sa nepodarilo spracovať.',
            'The photo could not be processed.'
          );
      }

      if (saveButton) {

        saveButton.disabled =
          false;

        saveButton.textContent =
          A(
            'Uložiť',
            'Save'
          );
      }

      return;
    }

    const filePath =
      `${currentUser.id}/avatar.jpg`;

    const {
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from(
          'profile-avatars'
        )
        .upload(
          filePath,
          blob,
          {
            contentType:
              'image/jpeg',

            upsert:
              true
          }
        );

    if (uploadError) {

      if (message) {

        message.textContent =
          A(
            'Fotografiu sa nepodarilo nahrať.',
