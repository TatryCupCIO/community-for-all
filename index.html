<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">

<title>Community For All</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#fff;min-height:100vh}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.container{max-width:600px;margin:auto;padding:16px 18px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:46px}
.top-left,.top-actions{display:flex;align-items:center}.top-actions{gap:8px}
.user-btn,.cart-top-btn,.lang-btn,.back-btn,.donate-top-btn{border:1px solid #475569;background:#1e293b;color:#fff;border-radius:9px;padding:9px 12px}
.donate-top-btn{background:#be123c;border-color:#e11d48;font-weight:800}
.cart-top-btn{position:relative;font-size:19px}
.cart-badge{position:absolute;right:-7px;top:-8px;background:#ef4444;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 5px;display:none;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid #111827}
.logo{text-align:center;margin:6px 0 5px;font-size:32px;font-weight:800}
.community{color:#ff9f43}.for{color:#32d7e8}.all{color:#ff5c5c}
.charity{text-align:center;color:#cbd5e1;font-size:12px;letter-spacing:1px;margin-bottom:15px}
.language{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
.lang-btn.active{border-color:#f59e0b;color:#fbbf24}
.menu-btn{display:block;width:100%;margin:12px 0;padding:17px 15px;border:0;border-radius:12px;color:#fff;font-size:17px;font-weight:700}
.events{background:#f59e0b}.bookings{background:#0891b2}.fatra{background:#16a34a}.face{background:#d98cff;color:#111827}.about{background:#dc2626}.contact{background:#2563eb}
.page{display:none}.page h2{text-align:center}
.card,.event-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-bottom:15px;line-height:1.55}
.event-card{cursor:pointer}.event-title{font-size:20px;font-weight:800;color:#fbbf24;margin-bottom:8px}
.event-info,.small{color:#cbd5e1}.small{font-size:13px}
.detail-section{margin-top:18px}.detail-section h3{margin-bottom:8px;color:#fbbf24}
.detail-text{white-space:pre-line;color:#e2e8f0}.reserve-heading{margin-top:28px;text-align:center;color:#86efac}
.option-group{margin-top:18px;padding-top:14px;border-top:1px solid #475569}
.option-title{font-size:17px;font-weight:800;margin-bottom:8px}
.option-row{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;margin:8px 0}
.option-name{font-weight:700}.option-description{color:#cbd5e1;font-size:13px;margin-top:6px;white-space:pre-line}
.option-price{color:#86efac;font-weight:800;margin-top:7px}
.option-special{margin-top:7px;color:#fbbf24;font-size:13px;font-weight:700}
.qty-line{display:flex;align-items:center;gap:10px;margin-top:12px}
.qty-btn,.guest-btn{border:0;border-radius:8px;background:#334155;color:#fff;font-size:20px;font-weight:800}
.qty-btn{width:38px;height:38px}.guest-btn{width:34px;height:34px}
.qty-value,.guest-count{min-width:28px;text-align:center;font-weight:800}
.add-btn{margin-left:auto;border:0;border-radius:8px;padding:10px 12px;background:#16a34a;color:#fff;font-weight:800}
.guest-box{margin-top:14px;padding:13px;background:#172033;border:1px solid #334155;border-radius:10px}
.guest-title{font-weight:800;margin-bottom:10px}
.guest-section{margin-top:12px;padding-top:12px;border-top:1px solid #334155}

.guest-counter-label{font-weight:700}.guest-counter-controls{display:flex;align-items:center;gap:10px}
.child-age-list{margin-top:7px}.child-age-row{display:flex;gap:8px;align-items:center;margin-top:8px}

.paid-child-title{color:#fde68a;font-weight:800}.free-child-title{color:#86efac;font-weight:800}

.free-price{display:block;margin-top:5px;color:#86efac;font-size:15px;font-weight:900}
.capacity-note{margin-top:9px;color:#fbbf24;font-size:12px;font-weight:700}
.guest-required-note{margin-top:9px;color:#cbd5e1;font-size:12px}
.child-box{margin-top:10px;padding:10px;background:#172033;border-radius:9px}
.cart-box{margin-top:18px;background:#172554;border:1px solid #3b82f6;border-radius:12px;padding:14px}
.countdown{font-weight:800;color:#fbbf24;margin:8px 0}
.cart-item{padding:11px 0;border-bottom:1px solid #334155}
.cart-item-line{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.remove-btn{border:0;border-radius:7px;background:#7f1d1d;color:#fff;padding:7px 9px;white-space:nowrap}
.cart-total{font-size:18px;font-weight:800;margin-top:10px}
.cart-actions{display:grid;gap:9px;margin-top:14px}
.secondary-btn,.checkout-btn{width:100%;border:0;border-radius:9px;padding:13px;font-weight:800;color:#fff}
.secondary-btn{background:#334155}.checkout-btn{background:#16a34a}
.checkout-btn:disabled{background:#475569;color:#cbd5e1;cursor:not-allowed}
label{display:block;margin-top:15px;margin-bottom:6px;font-weight:700}
input,textarea,select{width:100%;border:1px solid #475569;background:#0f172a;color:#fff;border-radius:9px;padding:12px;font-size:16px}
textarea{min-height:130px}
.checkbox-line{display:flex;align-items:flex-start;gap:9px;margin-top:14px}.checkbox-line input{width:auto;margin-top:4px}.checkbox-line label{margin:0;font-weight:400}
.submit-btn{width:100%;border:0;border-radius:9px;padding:14px;margin-top:18px;background:#0ea5e9;color:#fff;font-size:16px;font-weight:700}
.logout-btn{background:#dc2626}.green-btn{background:#16a34a}.purple-btn{background:#d98cff;color:#111827}
.auth-link-btn{background:none;border:0;color:#7dd3fc;text-decoration:underline;margin-top:12px}.auth-links{text-align:center}
.message{display:none;margin-top:15px;padding:12px;border-radius:9px;text-align:center}
.success{display:block;background:#14532d;border:1px solid #22c55e}.error{display:block;background:#7f1d1d;border:1px solid #ef4444}.info{display:block;background:#164e63;border:1px solid #22d3ee}
.loading{text-align:center;color:#cbd5e1;padding:25px}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:35px;line-height:1.6}
.account-name{text-align:center;font-size:22px;font-weight:700}.account-email{text-align:center;color:#cbd5e1;margin-bottom:20px;overflow-wrap:anywhere}
.donate-hero{text-align:center}.donate-heart{font-size:46px}.donate-motto{font-size:20px;font-weight:800;margin:8px 0}.donate-sub{color:#cbd5e1}
.amount-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.amount-btn{border:1px solid #fb7185;background:#4c0519;color:#fff;border-radius:9px;padding:11px 5px;font-weight:800}.amount-btn.active{background:#e11d48}
.donation-row{padding:10px 0;border-bottom:1px solid #334155}.donation-name{font-weight:800}.donation-amount{color:#86efac;font-weight:800}
.notice{padding:12px;background:#422006;border:1px solid #a16207;border-radius:9px;color:#fde68a;margin-top:12px}
.status-pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#334155;font-size:12px;margin-top:5px}
@media(max-width:420px){.container{padding-left:12px;padding-right:12px}.donate-top-btn,.user-btn{padding:8px 9px;font-size:13px}.cart-top-btn{padding:8px 10px}.logo{font-size:29px}}
</style>
</head>

<script>
const SUPABASE_URL='https://btkblcngijheanyhyiow.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_0f7Y2P49SneR1E_ZZgjsrw_679teyVH';
const APP_URL='https://tatrycupcio.github.io/community-for-all/';

const supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);

let currentLanguage='sk';
let currentUser=null;
let currentEvent=null;
let currentEventOptions=[];
let allEventOptions=[];
let activeCart=null;
let countdownTimer=null;

const T=(sk,en)=>currentLanguage==='sk'?sk:en;
const el=id=>document.getElementById(id);

const pages=[
'eventsPage',
'eventDetailPage',
'cartPage',
'bookingsPage',
'donatePage',
'loginPage',
'registerPage',
'accountPage',
'forgotPage',
'resetPage',
'aboutPage',
'contactPage',
'fatraPage',
'facePage'
];

function hidePages(){
el('homePage').style.display='none';
pages.forEach(x=>el(x).style.display='none')
}

function showHome(){
hidePages();
el('homePage').style.display='block';
scrollTo(0,0)
}

function go(id){
hidePages();
el(id).style.display='block';
scrollTo(0,0)
}

function showMessage(id,text,type){
const x=el(id);
if(x){
x.className='message '+type;
x.textContent=text
}
}

function money(v){
return new Intl.NumberFormat(
'en-GB',
{style:'currency',currency:'GBP'}
).format(Number(v||0))
}

function escapeHtml(v){
return String(v??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'","&#039;")
}

function formatDate(s){
if(!s)return'';

return new Intl.DateTimeFormat(
currentLanguage==='sk'?'sk-SK':'en-GB',
{
day:'numeric',
month:'long',
year:'numeric'
}
).format(new Date(s+'T12:00:00'))
}

function eventDays(e){
return Math.max(
1,
Math.round(
(new Date(e.end_date)-new Date(e.start_date))/86400000
)+1
)
}

function eventNights(e){
return Math.max(1,eventDays(e)-1)
}

function getUsername(u){
return u?.user_metadata?.username?.trim()||''
}

/* EVENT DESCRIPTION LANGUAGE */
function localEventDescription(e){
if(!e)return'';

return currentLanguage==='sk'
?(e.description_sk||e.description||e.description_en||'')
:(e.description_en||e.description||e.description_sk||'')
}

function showLogin(){
go('loginPage')
}

function showRegister(){
go('registerPage')
}

function showForgotPassword(){
go('forgotPage')
}

function showResetPassword(){
go('resetPage')
}

function showAbout(){
go('aboutPage')
}

function requireLogin(){
if(currentUser)return true;

showLogin();

showMessage(
'loginMessage',
T(
'Pre pokračovanie sa musíte prihlásiť.',
'Please sign in to continue.'
),
'info'
);

return false
}

function showContact(){
if(requireLogin())go('contactPage')
}

function showFatra(){
if(requireLogin())go('fatraPage')
}

function showFace(){
if(requireLogin())go('facePage')
}

function openUserArea(){
currentUser?showAccount():showLogin()
}

function showAccount(){
if(!currentUser)return showLogin();

fillAccount();
go('accountPage')
}

function updateUserButton(){
el('userTopBtn').textContent=currentUser
?'👤 '+(getUsername(currentUser)||T('Môj účet','My Account'))
:T('👤 Prihlásiť sa','👤 Sign In')
}

function fillAccount(){
if(!currentUser)return;

el('accountUsername').textContent=
getUsername(currentUser)||T('Používateľ','User');

el('accountEmail').textContent=currentUser.email||'';
el('accountUsernameInput').value=getUsername(currentUser)
}

async function refreshCurrentUser(){
const{data}=await supabaseClient.auth.getUser();

currentUser=data?.user||null;

updateUserButton();
await refreshCartBadge()
}

private_room_2:[

private_lodge_4:[

adult_day_ticket:[

function localName(o){
const a=optionNames[o.option_code];

return a
?a[currentLanguage==='sk'?0:1]
:(o.name||'')
}

function localDescription(o){
return currentLanguage==='sk'
?(o.description_sk||o.description||o.description_en||'')
:(o.description_en||o.description||o.description_sk||'')
}

function localNoBed(o){
return currentLanguage==='sk'
?(o.child_no_bed_note_sk||'')
:(o.child_no_bed_note_en||'')
}

function isChild(o){
return (o.option_code||'').includes('child')||
(
o.max_age!==null &&
Number(o.max_age)<=17
)
}

function isTbd(o){
return Number(o.price)===0 &&
!o.is_free &&
!o.is_included &&
!o.free_with_accommodation
}

function collectsGuests(o){
return o.collect_guest_details===true
}

function isBedAccommodation(o){
return[
'shared_accommodation_adult',
'private_room_2',
'private_lodge_4'
].includes(o.option_code)
}

function isCamping(o){
return[
'small_tent',
'large_tent',
'caravan_motorhome'
].includes(o.option_code)
}

function isNightPricing(o){
return[
'per_night',
'per_person_per_night',
'per_room_per_night',
'per_tent_per_night',
'per_vehicle_per_night'
].includes(o.pricing_unit)
}

function isDayPricing(o){
return[
'per_day',
'per_person_per_day',
'per_vehicle_per_day'
].includes(o.pricing_unit)
}

function makeCounter(label,initial,onChange){

let count=initial;

const line=document.createElement('div');
line.className='guest-counter';

const lab=document.createElement('div');
lab.className='guest-counter-label';
lab.textContent=label;

const controls=document.createElement('div');
controls.className='guest-counter-controls';

const minus=document.createElement('button');
const value=document.createElement('span');
const plus=document.createElement('button');

minus.type='button';
plus.type='button';

minus.className='guest-btn';
plus.className='guest-btn';

minus.textContent='−';
plus.textContent='+';

value.className='guest-count';
value.textContent=count;

minus.onclick=()=>{

if(count>0){

count--;
value.textContent=count;
onChange(count)

}

};

plus.onclick=()=>{

count++;
value.textContent=count;
onChange(count)

};

controls.append(
minus,
value,
plus
);

line.append(
lab,
controls
);

return line
}

'add_accommodation_to_cart',

p_event_option_id:o.id,

p_adult_count:
adultCount,
p_paid_child_ages:
isBedAccommodation(o)
?paidChildAges.map(Number)
:[],
p_free_child_ages:
otherChildAges.map(Number),
p_number_of_nights:
isNightPricing(o)
?eventNights(e)
:1
}
);

error=result.error

}else{

await supabaseClient.rpc(
'add_item_to_cart',
{
p_event_option_id:o.id,
p_quantity:q,
p_child_ages:
isChild(o)
?ticketAges.map(Number)
:[],
p_number_of_days:
isDayPricing(o)
?eventDays(e)
:1,
p_number_of_nights:
isNightPricing(o)
?eventNights(e)
:1,
p_option_date:
isDayPricing(o)
?e.start_date
:null,
p_adult_count:0
}
);

error=result.error

}

add.disabled=false;

add.textContent=
T(
'Pridať',
'Add'
);

if(error){

return alert(
T(
'Nepodarilo sa pridať položku: ',
'Could not add item: '
)+error.message
)

}

await refreshCartBadge();

alert(
T(
'Položka bola pridaná do košíka.',
'Item added to cart.'
)
)

}

}

async function getActiveCart(){

if(!currentUser)return null;

const{data,error}=
await supabaseClient
.from('bookings')
.select('*')
.eq('user_id',currentUser.id)
.eq('status','cart')
.order('created_at',{ascending:false})
.limit(1)
.maybeSingle();

if(error)return null;

return data||null
}

.select(
'*,event_options(option_code,is_accommodation,free_with_accommodation)'
)
.eq('booking_id',id)
.order('created_at');

if(error)return[];

return data||[]
}

async function refreshCartBadge(){

const badge=
el('cartBadge');

if(!currentUser){

badge.style.display='none';
badge.textContent='0';
activeCart=null;

return
}

const cart=
await getActiveCart();

activeCart=cart;

if(!cart){

badge.style.display='none';
badge.textContent='0';

return
}

const items=
await getCartItems(cart.id);

const count=
items.reduce(
(s,i)=>
s+Number(i.quantity||1),
0
);

badge.textContent=
String(count);

badge.style.display=
count
?'flex'
:'none'
}

}

function startCountdowns(){

clearInterval(countdownTimer);

const tick=()=>{

document
.querySelectorAll('.countdown')
.forEach(x=>{

const exp=x.dataset.exp;

if(!exp){

x.textContent='';
return

}

const t=
new Date(exp).getTime()-
Date.now();

if(t<=0){

x.textContent=
T(
'Čas košíka vypršal.',
'Cart time expired.'
);

return

}

const m=
Math.floor(t/60000);

const s=
Math.floor(
(t%60000)/1000
);

x.textContent=
T(
'Rezervované ešte: ',
'Reserved for: '
)+
m+
':'+
String(s).padStart(2,'0')

})

};

tick();

countdownTimer=
setInterval(
tick,
1000
)
}
