        saveButton.disabled =
          false;

        saveButton.textContent =
          A(
            'Uložiť',
            'Save'
          );
      }

      return;
    }

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(
          'profile-avatars'
        )
        .getPublicUrl(
          filePath
        );

    const avatarUrl =
      publicData.publicUrl +
      '?v=' +
      Date.now();

    const {
      error: profileError
    } =
      await supabaseClient
        .from(
          'user_profiles'
        )
        .update({
          avatar_url:
            avatarUrl,

          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          'user_id',
          currentUser.id
        );

    if (profileError) {

      if (message) {

        message.textContent =
          A(
            'Profilovú fotografiu sa nepodarilo uložiť.',
            'The profile photo could not be saved.'
          );
      }

      if (saveButton) {

        saveButton.disabled =
          false;

        saveButton.textContent =
          A(
            'Uložiť',
            'Save'
          );
      }

      return;
    }

    closeAvatarEditor();

    await refreshAvatarControls();
    await updateUserButton();

    if (
      typeof window
        .loadPrivateUsers ===
      'function'
    ) {
      await window
        .loadPrivateUsers();
    }

    if (message) {

      message.textContent =
        A(
          'Profilová fotografia bola uložená.',
          'Profile photo saved.'
        );
    }

    if (saveButton) {

      saveButton.disabled =
        false;

      saveButton.textContent =
        A(
          'Uložiť',
          'Save'
        );
    }
  }

  async function deleteProfileAvatar() {

    if (!currentUser) {
      return;
    }

    const confirmed =
      confirm(
        A(
          'Naozaj chcete odstrániť profilovú fotografiu?',
          'Do you really want to remove your profile photo?'
        )
      );

    if (!confirmed) {
      return;
    }

    const message =
      document.getElementById(
        'profileAvatarMessage'
      );

    if (message) {

      message.textContent =
        A(
          'Odstraňujem...',
          'Removing...'
        );
    }

    const {
      error: storageError
    } =
      await supabaseClient
        .storage
        .from(
          'profile-avatars'
        )
        .remove([
          `${currentUser.id}/avatar.jpg`,
          `${currentUser.id}/avatar.webp`
        ]);

    if (storageError) {

      console.error(
        'Avatar storage delete:',
        storageError
      );
    }

    const {
      error: profileError
    } =
      await supabaseClient
        .from(
          'user_profiles'
        )
        .update({
          avatar_url:
            null,

          updated_at:
            new Date()
              .toISOString()
        })
        .eq(
          'user_id',
          currentUser.id
        );

    if (profileError) {

      if (message) {

        message.textContent =
          A(
            'Fotografiu sa nepodarilo odstrániť.',
            'The photo could not be removed.'
          );
      }

      return;
    }

    await refreshAvatarControls();
    await updateUserButton();

    if (
      typeof window
        .loadPrivateUsers ===
      'function'
    ) {

      await window
        .loadPrivateUsers();
    }

    if (message) {

      message.textContent =
        A(
          'Profilová fotografia bola odstránená.',
          'Profile photo removed.'
        );
    }
  }

  async function refreshAvatarControls() {

    if (!currentUser) {
      return;
    }

    const {
      data
    } =
      await supabaseClient
        .from(
          'user_profiles'
        )
        .select(
          'avatar_url'
        )
        .eq(
          'user_id',
          currentUser.id
        )
        .maybeSingle();

    const preview =
      document.getElementById(
        'profileAvatarPreview'
      );

    const button =
      document.getElementById(
        'profileAvatarButton'
      );

    let deleteButton =
      document.getElementById(
        'profileAvatarDeleteButton'
      );

    if (preview) {

      if (
        data?.avatar_url
      ) {

        preview.innerHTML = `
          <img
            src="${data.avatar_url}"
            alt=""
            style="
              width:100%;
              height:100%;
              object-fit:cover;
            "
          >
        `;

      } else {

        preview.innerHTML =
          '👤';
      }
    }

    if (button) {

      button.textContent =
        data?.avatar_url
          ? A(
              '📷 Zmeniť fotografiu',
              '📷 Change photo'
            )
          : A(
              '📷 Nahrať profilovú fotku',
              '📷 Upload profile photo'
            );
    }

    if (
      data?.avatar_url
    ) {

      if (
        !deleteButton &&
        button
      ) {

        deleteButton =
          document.createElement(
            'button'
          );

        deleteButton.id =
          'profileAvatarDeleteButton';

        deleteButton.type =
          'button';

        deleteButton.className =
          'secondary-btn';

        deleteButton.style.marginTop =
          '10px';

        button
          .insertAdjacentElement(
            'afterend',
            deleteButton
          );
      }

      if (deleteButton) {

        deleteButton.style.display =
          'inline-block';

        deleteButton.textContent =
          A(
            '🗑️ Odstrániť fotografiu',
            '🗑️ Remove photo'
          );

        deleteButton.onclick =
          deleteProfileAvatar;
      }

    } else if (
      deleteButton
    ) {

      deleteButton.style.display =
        'none';
    }
  }

  function connectAvatarInput() {

    const input =
      document.getElementById(
        'profileAvatarInput'
      );

    if (!input) {
      return;
    }

    input.onchange =
      function (event) {

        const file =
          event.target
            .files?.[0];

        if (!file) {
          return;
        }

        if (
          ![
            'image/jpeg',
            'image/png',
            'image/webp'
          ].includes(
            file.type
          )
        ) {

          const message =
            document.getElementById(
              'profileAvatarMessage'
            );

          if (message) {

            message.textContent =
              A(
                'Použite fotografiu JPG, PNG alebo WEBP.',
                'Please use a JPG, PNG or WEBP image.'
              );
          }

          event.target.value =
            '';

          return;
        }

        if (
          file.size >
          10 * 1024 * 1024
        ) {

          const message =
            document.getElementById(
              'profileAvatarMessage'
            );

          if (message) {

            message.textContent =
              A(
                'Fotografia je príliš veľká.',
                'The photo is too large.'
              );
          }

          event.target.value =
            '';

          return;
        }

        openAvatarEditor(
          file
        );

        event.target.value =
          '';
      };
  }

  const originalShowAccountCrop =
    window.showAccount;

  window.showAccount =
    function () {

      const result =
        originalShowAccountCrop
          .apply(
            this,
            arguments
          );

      setTimeout(
        () => {

          createAvatarEditor();
          connectAvatarInput();
          refreshAvatarControls();
          updateAvatarEditorLanguage();
        },
        0
      );

      return result;
    };

  const originalCropLanguage =
    window.setLanguage;

  window.setLanguage =
    function (lang) {

      originalCropLanguage
        .apply(
          this,
          arguments
        );

      setTimeout(
        () => {

          updateAvatarEditorLanguage();

          if (currentUser) {
            refreshAvatarControls();
          }
        },
        0
      );
    };

  createAvatarEditor();
  connectAvatarInput();

})();
</script>

<script>
/* ===== APP NAVIGATION ===== */

(function () {

  /*
    Tento blok už NEPOUŽÍVA MutationObserver.
    Ten bol zdrojom duplicitných history záznamov.
  */

  let restoringHistory =
    false;

  function currentView() {

    const privateChat =
      document.getElementById(
        'privateChatPage'
      );

    if (
      privateChat &&
      getComputedStyle(
        privateChat
      ).display !==
      'none'
    ) {
      return 'privateChatPage';
    }

    const privateUsers =
      document.getElementById(
        'privateUsersPage'
      );

    if (
      privateUsers &&
      getComputedStyle(
        privateUsers
      ).display !==
      'none'
    ) {
      return 'privateUsersPage';
    }

    const chat =
      document.getElementById(
        'chatPage'
      );

    if (
      chat &&
      getComputedStyle(
        chat
      ).display !==
      'none'
    ) {
      return 'chatPage';
    }

    for (
      const id of pages
    ) {

      const page =
        document.getElementById(
          id
        );

      if (
        page &&
        getComputedStyle(
          page
        ).display !==
        'none'
      ) {
        return id;
      }
    }

    return 'HOME';
  }

  function pushView(view) {

    if (
      restoringHistory
    ) {
      return;
    }

    if (
      history.state
        ?.cfaView ===
      view
    ) {
      return;
    }

    history.pushState(
      {
        cfaView: view
      },
      '',
      location.href
    );
  }

  /*
    Zachytíme bežné vnútorné obrazovky.
    Funkcie zostávajú tie isté,
    iba po úspešnom otvorení pridajú
    jeden history záznam.
  */

  const originalGo =
    window.go;

  window.go =
    function (id) {

      const result =
        originalGo.apply(
          this,
          arguments
        );

      pushView(id);

      return result;
    };

  /*
    HOME:
    na HOME nevytvárame nekonečný
    reťazec ďalších HOME stavov.
  */

  const originalNavigationShowHome =
    window.showHome;

  window.showHome =
    function () {

      const result =
        originalNavigationShowHome
          .apply(
            this,
            arguments
          );

      if (
        !restoringHistory &&
        history.state
          ?.cfaView !==
        'HOME'
      ) {

        history.pushState(
          {
            cfaView:
              'HOME'
          },
          '',
          location.href
        );
      }

      return result;
    };

  /*
    Súkromný zoznam používateľov.
  */

  if (
    typeof window
      .openPrivateUsers ===
    'function'
  ) {

    const originalPrivateUsers =
      window.openPrivateUsers;

    window.openPrivateUsers =
      async function () {

        const result =
          await originalPrivateUsers
            .apply(
              this,
              arguments
            );

        if (
          document
            .getElementById(
              'privateUsersPage'
            )
            ?.style.display ===
          'block'
        ) {
          pushView(
            'privateUsersPage'
          );
        }

        return result;
      };
  }

  /*
    Verejný chat už používa vlastný
    history state v chat.js.
    Preto mu NEPRIDÁVAME druhý
    history.pushState.
  */

  /*
    Súkromný chat už používa vlastný
    history state v private-chat.js.
    Preto mu takisto NEPRIDÁVAME
    ďalší history.pushState.
  */

  function restoreView(
    state
  ) {

    restoringHistory =
      true;

    try {

      if (
        state?.privateChat
      ) {

        /*
          private-chat.js má vlastný
          popstate handler.
          Tu mu do toho nezasahujeme.
        */

        return;
      }

      if (
        state?.communityChat
      ) {

        /*
          chat.js má vlastný
          popstate/history systém.
          Neotvárame druhú kópiu.
        */

        return;
      }

      const view =
        state?.cfaView ||
        'HOME';

      if (
        view ===
        'HOME'
      ) {

        originalNavigationShowHome();

        return;
      }

      if (
        view ===
        'eventsPage'
      ) {

        showEvents();
        return;
      }

      if (
        view ===
        'bookingsPage'
      ) {

        showBookings();
        return;
      }

      if (
        view ===
        'cartPage'
      ) {

        showCartPage();
        return;
      }

      if (
        view ===
        'donatePage'
      ) {

        showDonate();
        return;
      }

      if (
        view ===
        'privateUsersPage'
      ) {

        if (
          typeof window
            .openPrivateUsers ===
          'function'
        ) {

          window
            .openPrivateUsers();
        }

        return;
      }

      hidePages();
      hideChatPages();

      const container =
        document.querySelector(
          '.container'
        );

      if (container) {
        container.style.display =
          '';
      }

      const page =
        document.getElementById(
          view
        );

      if (page) {

        page.style.display =
          'block';

        window.scrollTo(
          0,
          0
        );

      } else {

        originalNavigationShowHome();
      }

    } finally {

      setTimeout(
        () => {
          restoringHistory =
            false;
        },
        0
      );
    }
  }

  /*
    Počiatočný stav aplikácie.
  */

  history.replaceState(
    {
      cfaView: 'HOME'
    },
    '',
    location.href
  );

  /*
    Android/browser BACK.
    Na HOME vytvoríme ochranný HOME stav,
    takže Back aplikáciu nezatvorí.
  */

  window.addEventListener(
    'popstate',
    event => {

      const state =
        event.state;

      if (
        !state
      ) {

        history.pushState(
          {
            cfaView:
              'HOME'
          },
          '',
          location.href
        );

        restoreView({
          cfaView:
            'HOME'
        });

        return;
      }

      restoreView(
        state
      );
    }
  );

  /*
    Prvý ochranný history záznam.
  */

  history.pushState(
    {
      cfaView: 'HOME'
    },
    '',
    location.href
  );

})();
</script>


<script>
/* ===== ANDROID FIREBASE TOKEN ===== */

let androidFirebaseToken = null;
let androidFirebaseSaving = false;

function requestAndroidFirebaseToken() {
  if (typeof window.AndroidFirebase?.postMessage !== 'function') return;
  window.AndroidFirebase.postMessage('requestToken');
}

async function saveAndroidFirebaseToken() {
  try { if (localStorage.getItem('cfa.webPush.disabled') === 'true') return; } catch (_) {}
  if (!androidFirebaseToken || androidFirebaseSaving) return;
  androidFirebaseSaving = true;
  try {
    const { data: authData, error: authError } =
      await supabaseClient.auth.getUser();
    if (authError || !authData?.user) return;

    const userId = authData.user.id;
    const token = androidFirebaseToken;
    const { data: existing, error: checkError } =
      await supabaseClient.from('push_tokens')
        .select('id')
        .eq('user_id', userId)
        .eq('token', token)
        .limit(1);
    if (checkError) throw checkError;

    if (existing?.length) {
      const { error } = await supabaseClient.from('push_tokens')
        .update({ updated_at: new Date().toISOString() })
        .eq('id', existing[0].id)
        .eq('user_id', userId);
      if (error) throw error;
    } else {
      const { error } = await supabaseClient.from('push_tokens')
        .insert({ user_id: userId, token });
      if (error) throw error;
    }
    let pushDisabled = false;
    try { pushDisabled = localStorage.getItem('cfa.webPush.disabled') === 'true'; } catch (_) {}
    if (pushDisabled) await removeAndroidFirebaseToken(userId);
    window.dispatchEvent(new Event('cfa:android-push-registered'));
  } catch (error) {
    console.error('Firebase token registration failed:', error);
  } finally {
    androidFirebaseSaving = false;
  }
}

async function removeAndroidFirebaseToken(userId) {
  if (!androidFirebaseToken || !userId) return;
  try {
    const { error } = await supabaseClient.from('push_tokens')
      .delete()
      .eq('user_id', userId)
      .eq('token', androidFirebaseToken);
    if (error) throw error;
  } catch (error) {
    console.error('Firebase token removal failed:', error);
  }
}

if (typeof window.AndroidFirebase?.postMessage === 'function') {
  // AndroidX WebView message listeners expose onmessage.
  window.AndroidFirebase.onmessage = async function(event) {
    try {
      const message = JSON.parse(event.data);
      if (message.type !== 'firebaseToken' ||
          typeof message.token !== 'string' || !message.token) return;
      androidFirebaseToken = message.token;
      await saveAndroidFirebaseToken();
    } catch (error) {
      console.error('Firebase token message error:', error);
    }
  };
  requestAndroidFirebaseToken();
}
</script>

<script>
/* OWNER activity: record only real interactions, never session refreshes. */
(function () {
  const OWNER_ID = 'd6a65190-8826-46f4-b78c-4f83f8f4a288';
  const MIN_INTERVAL_MS = 5 * 60 * 1000;
  let lastAttempt = 0;
  let inFlight = false;

  async function recordOwnerInteraction(event) {
    if (event.type === 'keydown' && !event.isTrusted) return;
    if (!event.isTrusted || inFlight || !currentUser || currentUser.id !== OWNER_ID) return;
    const now = Date.now();
    if (now - lastAttempt < MIN_INTERVAL_MS) return;
    lastAttempt = now;
    inFlight = true;
    try {
      const { error } = await supabaseClient.rpc('record_owner_activity');
      if (error) console.warn('Owner activity could not be recorded:', error.message);
    } catch (error) {
      console.warn('Owner activity could not be recorded:', error);
    } finally {
      inFlight = false;
    }
  }

  document.addEventListener('pointerdown', recordOwnerInteraction, { passive: true });
  document.addEventListener('keydown', recordOwnerInteraction);
})();
</script>

  function cfaValidateEventTranslations(record){
    const display=record.display_settings||{};
    if(!String(record.title||'').trim()||!String(display.title_en||'').trim()){message(text('Doplň názov podujatia v slovenčine aj angličtine.','Enter the event title in both Slovak and English.'),true);return false;}
    for(const key of ['short_description','event_details','programme','important_information','booking_information']){
      if(display['show_'+key]===false)continue;
      if(!!String(record[key]||'').trim()!==!!String(display[key+'_en']||'').trim()){message(text('Doplň slovenský aj anglický text v sekcii: ','Enter both the Slovak and English text for: ')+eventFields.find(f=>f[0]===key)?.[1]?.[currentLanguage==='en'?1:0],true);return false;}
    }
    if(display.show_description!==false&&!!String(record.description_sk||'').trim()!==!!String(record.description_en||'').trim()){message(text('Doplň slovenský aj anglický popis podujatia.','Enter the event description in both Slovak and English.'),true);return false;}
    const legacy=record.description&&!['',record.description_sk,record.description_en].includes(record.description);
    if(legacy&&display.show_legacy_description!==false&&!String(display.legacy_description_en||'').trim()){message(text('Doplň anglický preklad odlišného pôvodného opisu.','Translate the distinct original description into English.'),true);return false;}
    return true;
  }

  function showDiscountForm(){

<script id="cfaCartDiscountModule">
/* Existing RPCs validate the owner of the cart, eligibility, dates and discount limits. */
function cfaAttachCartDiscount(box, bookingId) {
  const tr = (sk,en) => currentLanguage === 'en' ? en : sk;
  const form = document.createElement('form');
  form.id = 'cfaCartDiscount';
  const label = document.createElement('label');
  label.htmlFor = 'cfaCartDiscountCode';
  label.textContent = tr('Zľavový kód','Discount code');
  const row = document.createElement('div');
  row.className = 'cfa-discount-row';
  const input = document.createElement('input');
  input.id = 'cfaCartDiscountCode';input.type = 'text';input.name = 'discount_code';
  input.placeholder = tr('Sem vlož zľavový kód','Enter your discount code');
  input.autocomplete = 'off';input.spellcheck = false;input.autocapitalize = 'characters';
  const apply = document.createElement('button');apply.type = 'submit';apply.textContent = tr('Použiť','Apply');
  const remove = document.createElement('button');remove.type = 'button';remove.textContent = tr('Odstrániť zľavu','Remove discount');
  remove.hidden = !activeCart?.discount_code_id;
  const feedback = document.createElement('p');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
  if(activeCart?.discount_code_id){feedback.textContent=tr('Zľava je uplatnená: ','Discount applied: ')+money(activeCart.discount_amount);feedback.className='cfa-discount-ok';}
  row.append(input,apply);if(!remove.hidden)row.appendChild(remove);form.append(label,row,feedback);box.appendChild(form);
  let pending = false;
  const errors = [
    ['reward_coupon_not_for_account','Tento kupón je určený inému účtu alebo nárok momentálne nie je platný.','This coupon belongs to another account or the entitlement is currently invalid.'],
    ['reward_coupon_used','Tento jednorazový kupón už bol využitý.','This single-use coupon has already been used.'],
    ['reward_coupon_in_another_cart','Kupón je rezervovaný v inom košíku. V truhličke otvorte pôvodnú platbu.','This coupon is reserved in another cart. Open the original checkout from your treasure chest.'],
    ['Invalid or expired discount code','Kód je neplatný, vypnutý alebo mu skončila platnosť.','This code is invalid, disabled or expired.'],
    ['Discount code usage limit reached','Kód už dosiahol povolený počet použití.','This code has reached its usage limit.'],
    ['Discount code already used','Tento kód si už použil/a.','You have already used this code.'],
    ['Minimum booking amount not reached','Košík nedosahuje minimálnu sumu pre túto zľavu.','Your cart does not meet the minimum amount for this discount.'],
    ['This discount code does not apply to this cart','Kód neplatí na položky v tomto košíku.','This code does not apply to the items in this cart.'],
    ['Cart not found or expired','Košík už nie je dostupný alebo mu vypršal čas.','This cart is no longer available or has expired.'],
    ['Authentication required','Prihlás sa a skús to znova.','Sign in and try again.']
  ];
  async function submit(removing) {
    if(pending)return;
    const code=input.value.trim();
    if(!removing&&!code){feedback.textContent=tr('Najprv vlož zľavový kód.','Enter a discount code first.');feedback.className='cfa-discount-error';input.focus();return;}
    pending=true;apply.disabled=true;remove.disabled=true;input.disabled=true;form.setAttribute('aria-busy','true');
    feedback.textContent=tr('Overujem zľavu…','Checking discount…');feedback.className='';
    try {
      const {data,error}=await supabaseClient.rpc(removing?'remove_discount_code':'apply_discount_code',removing?{p_booking_id:bookingId}:{p_booking_id:bookingId,p_code:code});
      if(error)throw error;
      const result=Array.isArray(data)?data[0]:data;
      if(!result)throw new Error('No discount result');
      // Always reload authoritative totals and keep the original countdown machinery.
      if(activeCart?.id===bookingId){activeCart.subtotal_amount=result.subtotal;activeCart.discount_amount=result.discount;activeCart.total_amount=result.total;}
      await showCartPage();
    } catch(error) {
      console.error('Cart discount:',error);
      const match=errors.find(([message])=>String(error.message||'').includes(message));
      feedback.textContent=match?tr(match[1],match[2]):tr('Zľavu sa nepodarilo upraviť. Kód zostal v políčku; skús to znova.','The discount could not be updated. Your code is still in the field; try again.');
      feedback.className='cfa-discount-error';
    } finally {pending=false;apply.disabled=false;remove.disabled=false;input.disabled=false;form.removeAttribute('aria-busy');}
  }
  form.addEventListener('submit',event=>{event.preventDefault();submit(false);});
  remove.addEventListener('click',()=>submit(true));
}
</script>

<script id="cfaRequiredAgeModule">
function cfaValidateChildAgeFields(row) {
  const inputs=Array.from(row.querySelectorAll('.child-age-row input'));
  row.querySelectorAll('.cfa-age-error').forEach(node=>node.remove());
  let first=null;
  for(const input of inputs){
    const raw=input.value.trim();const value=Number(raw);
    const min=input.min===''?0:Number(input.min);
    const max=input.max===''?17:Number(input.max);
    const invalid=raw===''||!Number.isInteger(value)||value<min||value>max;
    input.setAttribute('aria-invalid',String(invalid));
    if(invalid&&!first)first=input;
  }
  if(!first)return true;
  const error=document.createElement('div');error.className='cfa-age-error';
  error.setAttribute('role','alert');error.setAttribute('aria-live','assertive');
  error.textContent=T(
